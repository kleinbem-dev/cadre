<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="680" height="140">
  <defs>
    <radialGradient id="banner-spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="banner-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="banner-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="680" height="140" rx="16" fill="#0b0f19" />

  <!-- Icon Group (x offset: 32, y center: 70) -->
  <g transform="translate(32, 22)">
    <!-- Base Icon Container (96x96) -->
    <rect width="96" height="96" rx="20" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    <circle cx="48" cy="48" r="30" fill="url(#banner-spark-glow)" />

    <!-- Corner Brackets -->
    <path d="M 22 34 L 22 24 A 4 4 0 0 1 26 20 L 36 20" fill="none" stroke="url(#banner-frame)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 60 20 L 70 20 A 4 4 0 0 1 74 24 L 74 34" fill="none" stroke="url(#banner-frame)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 74 62 L 74 72 A 4 4 0 0 1 70 76 L 60 76" fill="none" stroke="url(#banner-frame)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 36 76 L 26 76 A 4 4 0 0 1 22 72 L 22 62" fill="none" stroke="url(#banner-frame)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diamond -->
    <polygon points="48,30 63,48 48,66 33,48" fill="url(#banner-diamond)" />
    <polygon points="48,36 57,48 48,60 39,48" fill="#fef3c7" opacity="0.35" />
    <circle cx="48" cy="48" r="2.5" fill="#fff" opacity="0.9" />
  </g>

  <!-- Wordmark & Subtitle -->
  <text x="156" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="-0.03em">cadre</text>
  <text x="282" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#f59e0b" opacity="0.85">◈</text>

  <!-- Tagline -->
  <text x="158" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.01em">Private AI teammates on your own compute</text>
</svg>
