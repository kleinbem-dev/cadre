name: Maintain Flake
on:
  workflow_dispatch:
  schedule:
    # 02:45 UTC, after nix-packages (an input).
    - cron: '45 2 * * *'

# Nightly flake.lock PR, shared: kleinbem/actions' maintain-flake.
permissions: {}

jobs:
  maintain:
    uses: kleinbem/actions/.github/workflows/maintain-flake.yaml@f1b4f5fc52ea31b1f9e53ca29170570fe4651c7d # v1.7.1
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
